plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'org.jvmscript'
version = '5.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
    withJavadocJar()
}

ext {
    spockVersion = '2.4-M4-groovy-4.0'
    groovyVersion = '4.0.29'
    jacksonVersion = '2.19.1'
    awsSdkVersion = '2.29.51'
    bouncycastleVersion = '1.83'
    poiVersion = '5.4.1'
    log4jVersion = '2.24.3'
}

repositories {
    mavenLocal()
    mavenCentral()
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.apache.logging.log4j') {
            details.useVersion log4jVersion
        }
    }
    exclude group: 'xml-apis', module: 'xml-apis'
}

dependencies {
    // Mail
    api 'jakarta.mail:jakarta.mail-api:2.1.3'
    api 'org.eclipse.angus:angus-mail:2.0.5'
    api 'org.eclipse.angus:smtp:2.0.5'

    // Logging
    implementation "org.apache.logging.log4j:log4j-core:${log4jVersion}"
    implementation "org.apache.logging.log4j:log4j-slf4j2-impl:${log4jVersion}"

    // Apache Commons
    api 'commons-io:commons-io:2.19.0'
    api 'org.apache.commons:commons-lang3:3.20.0'
    api 'org.apache.commons:commons-compress:1.27.1'
    api 'org.apache.commons:commons-exec:1.4.0'
    api 'commons-cli:commons-cli:1.9.0'
    api 'commons-net:commons-net:3.11.1'

    // Jakarta
    api 'jakarta.persistence:jakarta.persistence-api:3.2.0'

    // HTTP
    api 'org.apache.httpcomponents:httpclient:4.5.14'
    api 'org.apache.httpcomponents:httpmime:4.5.14'

    // Apache POI
    api "org.apache.poi:poi:${poiVersion}"
    api("org.apache.poi:poi-ooxml:${poiVersion}") {
        exclude group: 'stax', module: 'stax-api'
    }

    // Jackson
    api "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
    api "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"
    api "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    api "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"

    // Parsing & Compression
    api 'com.univocity:univocity-parsers:2.9.1'
    api 'net.lingala.zip4j:zip4j:2.11.5'

    // SSH
    implementation 'com.hierynomus:sshj:0.39.0'

    // Disruptor
    api 'com.lmax:disruptor:4.0.0'

    // Bouncycastle (updated to jdk18on)
    api "org.bouncycastle:bcpg-jdk18on:${bouncycastleVersion}"
    api "org.bouncycastle:bcprov-jdk18on:${bouncycastleVersion}"

    // Database
    api 'org.sql2o:sql2o:1.8.0'

    // Netty
    api 'io.netty:netty-all:4.1.130.Final'

    // AWS SDK
    api "software.amazon.awssdk:s3:${awsSdkVersion}"
    api "software.amazon.awssdk:protocol-core:${awsSdkVersion}"

    // Box
    api 'com.box:box-java-sdk:4.14.0'

    // Groovy
    api "org.apache.groovy:groovy:${groovyVersion}"

    // Testing
    testImplementation("org.spockframework:spock-core:${spockVersion}") {
        exclude group: 'org.codehaus.groovy'
    }
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.4'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

test {
    useJUnitPlatform()
}