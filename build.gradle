plugins {
    id 'java-library'
    id 'maven-publish'
    // groovy plugin compiles src/test/groovy - without it the Spock specs silently never run
    id 'groovy'
}

// group and version are defined in gradle.properties
// dependency versions live in gradle/libs.versions.toml

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenLocal()
    mavenCentral()
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.apache.logging.log4j') {
            details.useVersion libs.versions.log4j.get()
        }
    }
    exclude group: 'xml-apis', module: 'xml-apis'
}

dependencies {
    // Mail
    api libs.jakarta.mail.api
    api libs.angus.mail
    api libs.angus.smtp

    // Logging: code compiles against the SLF4J facade only; log4j2 ships as the
    // default runtime backend for standalone scripts. Library-mode consumers
    // (Quarkus, Spring Boot, ...) exclude the log4j runtime artifacts and jvmscript
    // logging flows into the host application's backend (jboss-logmanager, logback).
    api libs.slf4j.api
    runtimeOnly libs.log4j.core
    runtimeOnly libs.log4j.slf4j2.impl
    // JSON structured logging (LOG_FORMAT=json) for Loki/OTel-collector/Splunk
    runtimeOnly libs.log4j.layout.template.json

    // DFLib - DataFrame Library
    implementation platform(libs.dflib.bom)
    implementation libs.dflib.core
    implementation libs.dflib.csv
    implementation libs.dflib.json

    // FastCSV - robust, RFC-4180 CSV parser used by the schema DataFrame loader.
    // (univocity-parsers is retained below for other classes; the schema loader uses FastCSV.)
    implementation libs.fastcsv

    // Apache Commons
    // commons-codec was previously an undeclared transitive of httpclient (used by fileCalculateSHA1)
    implementation libs.commons.codec
    api libs.commons.io
    api libs.commons.lang3
    api libs.commons.compress
    api libs.commons.exec
    api libs.commons.cli
    api libs.commons.net

    // Jakarta
    api libs.jakarta.persistence.api

    // HTTP
    api libs.httpclient
    api libs.httpmime

    // Apache POI
    api libs.poi.core
    api(libs.poi.ooxml) {
        exclude group: 'stax', module: 'stax-api'
    }

    // Jackson for JSON processing
    implementation platform(libs.jackson.bom)
    implementation libs.jackson.databind
    implementation libs.jackson.core
    implementation libs.jackson.annotations
    implementation libs.jackson.datatype.jsr310
    implementation libs.jackson.dataformat.yaml

    // NetworkNT JSON Schema Validator - supports Draft 2020-12
    implementation libs.json.schema.validator

    // Parsing & Compression
    api libs.univocity.parsers
    api libs.zip4j

    // SSH
    implementation libs.sshj

    // Disruptor
    api libs.disruptor

    // Bouncycastle
    api libs.bcpg
    api libs.bcprov

    // Database
    api libs.sql2o
    implementation libs.postgresql

    // Netty
    api libs.netty.all

    // AWS SDK
    api libs.aws.s3
    api libs.aws.protocol.core

    // Box
    api libs.box.java.sdk

    // Groovy
    api libs.groovy

    // Testing
    testImplementation(libs.spock.core) {
        exclude group: 'org.codehaus.groovy'
    }
    testImplementation libs.hamcrest
    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    // Gradle 9 requires the JUnit Platform launcher on the test runtime classpath explicitly.
    testRuntimeOnly libs.junit.platform.launcher
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

test {
    useJUnitPlatform()
}
